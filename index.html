<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#030712">
<title>Piano & MIDI Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<style>
  :root{
    --bg:#030712; --panel:#0f172a; --panel-2:#0b1120; --line:#1e293b;
    --text:#f1f5f9; --muted:#94a3b8; --indigo:#6366f1;
    --h-top:56px; --h-bar:50px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:manipulation}
  body{height:100vh;height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button,select,input{font-family:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}

  /* ---------- Top bar ---------- */
  .topbar{height:var(--h-top);flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 10px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;font-size:15px;
    background:linear-gradient(135deg,#6366f1,#9333ea);box-shadow:0 4px 12px rgba(99,102,241,.35)}
  .song{min-width:0;flex:0 1 170px;max-width:170px;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:12px}
  .cap{display:block;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#64748b;line-height:1.2}
  .val{font-size:15px;font-weight:800;color:#a5b4fc;line-height:1.1;white-space:nowrap}
  .note{display:block;font-size:20px;font-weight:900;color:#facc15;line-height:1.1;white-space:nowrap}
  .rep{background:#9333ea;color:#fff;font-size:11px;font-weight:800;padding:4px 7px;border-radius:6px;white-space:nowrap;transition:all 0.1s;}
  .shift{height:30px;display:flex;align-items:center;gap:6px;padding:0 9px;border-radius:8px;white-space:nowrap;
    background:rgba(245,158,11,.16);border:1px solid rgba(245,158,11,.55);color:#fcd34d;font-size:11px;font-weight:700;
    animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.6}}
  .actions{display:flex;align-items:center;gap:6px;flex-shrink:0}

  /* ---------- Buttons ---------- */
  .btn{height:40px;min-width:40px;padding:0 12px;border-radius:12px;border:1px solid #334155;background:#1e293b;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:700;color:#e2e8f0;
    white-space:nowrap;transition:transform .08s,background .15s}
  .btn:active{transform:scale(.94);background:#334155}
  .btn-icon{padding:0;width:40px}
  .btn-play{min-width:100px;background:linear-gradient(#10b981,#059669);border-color:#34d399;color:#fff;
    box-shadow:0 4px 14px rgba(16,185,129,.3)}
  .btn-play.playing{background:linear-gradient(#f59e0b,#b45309);border-color:#fbbf24;box-shadow:0 4px 14px rgba(245,158,11,.3)}

  /* ---------- Second bar ---------- */
  .bar2{height:var(--h-bar);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:0 10px;background:var(--panel-2);border-bottom:1px solid var(--line)}
  .select{height:36px;min-width:0;flex:0 1 230px;max-width:230px;padding:0 10px;border-radius:10px;border:1px solid #334155;
    background:#0f172a;font-size:12px;font-weight:600;outline:none}
  .seg{display:flex;padding:3px;gap:3px;border-radius:12px;background:#020617;border:1px solid var(--line)}
  .seg button{height:34px;padding:0 12px;border-radius:9px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--indigo);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.4)}
  .octave{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .oct-val{min-width:84px;text-align:center;line-height:1.1}
  .oct-val small{display:block;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#64748b}
  .oct-val b{font-size:15px;font-weight:900;color:#a5b4fc;white-space:nowrap}

  /* ---------- Keyboard ---------- */
  #keyboardWrap{flex:1;min-height:0;position:relative;background:linear-gradient(#0b1120,#020617)}
  #keyboard{position:absolute;left:8px;right:8px;top:8px;bottom:10px;touch-action:none;-webkit-touch-callout:none}
  .piano-key{position:absolute;top:0;height:100%;display:flex;justify-content:center;align-items:flex-end;touch-action:none;
    transition:background-color .05s,transform .05s,box-shadow .05s}
  .white-key{width:12.5%;padding-bottom:12px;border:1px solid #94a3b8;border-radius:0 0 10px 10px;z-index:1;color:#334155;
    background:linear-gradient(#ffffff 0%,#f8fafc 70%,#e2e8f0 100%);
    box-shadow:inset 0 -6px 0 #cbd5e1,0 6px 10px -4px rgba(0,0,0,.5)}
  .black-key{width:7.5%;height:62%;padding-bottom:9px;border:1px solid #000;border-radius:0 0 6px 6px;z-index:2;color:#cbd5e1;
    background:linear-gradient(#374151,#111827 85%,#0b0f19);
    box-shadow:inset 0 -4px 0 #1f2937,0 6px 10px -3px rgba(0,0,0,.8)}
  .key-label{pointer-events:none;font-size:12px;font-weight:800;letter-spacing:.02em}
  .black-key .key-label{font-size:9px;font-weight:700}
  .piano-key.active{transform:translateY(2px)}
  .white-key.active{background:linear-gradient(#c7d2fe,#a5b4fc);box-shadow:inset 0 3px 6px rgba(0,0,0,.25)}
  .black-key.active{background:linear-gradient(#4f46e5,#312e81);box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
  .white-key.target-next{background:linear-gradient(#fef9c3,#fde047);border-color:#ca8a04;color:#713f12;
    box-shadow:inset 0 -6px 0 #eab308,0 0 18px rgba(250,204,21,.7)}
  .black-key.target-next{background:linear-gradient(#facc15,#a16207);border-color:#fde047;color:#fffbeb;
    box-shadow:0 0 16px rgba(250,204,21,.8)}
  .rep-badge{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#9333ea;color:#fff;
    font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4)}

  /* ---------- Settings drawer ---------- */
  .overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(330px,85vw);display:flex;flex-direction:column;
    background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease;
    padding-right:env(safe-area-inset-right)}
  .drawer.open{transform:none}
  .drawer-head{height:var(--h-top);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 12px 0 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:14px}
  .drawer-body{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;
    -webkit-overflow-scrolling:touch;touch-action:pan-y}
  .field{display:flex;flex-direction:column;gap:6px}
  .fl{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .select.full{max-width:none;flex:none;width:100%;height:40px}
  .check{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
  .check input{
